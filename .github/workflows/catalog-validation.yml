name: Validate Awesome List

on:
  push:
    branches: [master]
    paths:
      - 'README.md'
      - 'COMPATIBILITY.md'
      - 'CONTRIBUTING.md'
      - 'RESEARCH_NOTES.md'
      - 'scripts/validate_catalog.py'
      - 'scripts/audit_github_projects.py'
      - 'tests/test_audit_github_projects.py'
      - '.github/workflows/upstream-audit.yml'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'COMPATIBILITY.md'
      - 'CONTRIBUTING.md'
      - 'RESEARCH_NOTES.md'
      - 'scripts/validate_catalog.py'
      - 'scripts/audit_github_projects.py'
      - 'tests/test_audit_github_projects.py'
      - '.github/workflows/upstream-audit.yml'
      - '.github/workflows/catalog-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate links, anchors and unique projects
        run: python3 scripts/validate_catalog.py
      - name: Test scheduled upstream metadata audit offline
        run: python3 -m unittest discover -s tests -p 'test_audit_github_projects.py' -v
